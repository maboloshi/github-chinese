# 贡献指南 —— 唯一维护来源
# 由 manage_templates.py 校验并生成 CN/TW 贡献指南。
#
# 规则：
#   - 纯字符串 → CN/TW 共享该值
#   - CN: "简体" / TW: "繁體" → 分语言翻译
#   - 结构字段（链接 URL 等）不翻译，保持原样
#   - 渲染：title→#，顶层字符串→原文；块字段首个子字段为 heading，层级 = 嵌套深度+2

