title:
  CN: GitHub 中文化 (VS Code 扩展)
  TW: GitHub 中文化 (VS Code 擴展)
slogan:
  CN: 一键安装 GitHub 扩展，实现 VS Code 集成浏览器中 GitHub 网页的中文化。
  TW: 一鍵安裝 GitHub 擴展，實現 VS Code 集成瀏覽器中 GitHub 網頁的中文化。
