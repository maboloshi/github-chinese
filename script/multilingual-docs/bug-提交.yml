# 多语言议题模板 —— 唯一维护来源
# 由 manage_templates.py 校验并生成 CN/TW 模板。
#
# 规则：
#   - 纯字符串 → CN/TW 共享该值
#   - CN: "简体"
#   - TW: "繁體" → 分语言翻译
#   - 结构字段（type, id, validations）不翻译，保持原样

name:
  CN: Bug 提交（简体中文）
  TW: Bug 提交（繁體中文）
description: 提交 BUG
labels: bug

body:
- type: markdown
  attributes:
    value:
      CN: '### 欢迎！'
      TW: '### 歡迎！'
- type: markdown
  attributes:
    value:
      CN: |
        感谢您提交议题！请补充以下内容，以便我们能更好地协助您。

        提交议题前确保您已阅读[常见问题（FAQ）](https://github.com/maboloshi/github-chinese/issues/493)。
      TW: |
        感謝您提交議題！請補充以下內容，以便我們能更好地協助您。

        提交議題前確保您已閱讀[常見問題（FAQ）](https://github.com/maboloshi/github-chinese/issues/493)。
- type: textarea
  id: description
  attributes:
    label:
      CN: 问题/建议
      TW: 問題/建議
    description:
      CN: 请描述你遇到的问题/提出的建议。
      TW: 請描述你遇到的問題/提出的建議。
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label:
      CN: 步骤
      TW: 步驟
    description:
      CN: 请逐步描述你遇到的问题，并带上测试链接（如有）。
      TW: 請逐步描述你遇到的問題，並帶上測試連結（如有）。
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label:
      CN: 预期
      TW: 預期
    description:
      CN: 请描述你对本插件行为的预期。
      TW: 請描述你對本插件行為的預期。
  validations:
    required: true
- type: textarea
  id: real
  attributes:
    label:
      CN: 实际
      TW: 實際
    description:
      CN: 请描述本插件的实际行为。
      TW: 請描述本插件的實際行為。
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label:
      CN: 附件
      TW: 附件
    description:
      CN: 请提供相关截图或附件（如有）。
      TW: 請提供相關截圖或附件（如有）。
  validations:
    required: false
- type: dropdown
  id: browser-name
  attributes:
    label:
      CN: 浏览器名称
      TW: 瀏覽器名稱
    description:
      CN: 请选择运行本插件的浏览器的名称。
      TW: 請選擇運行本插件的瀏覽器的名稱。
    options:
      - Microsoft Edge
      - Google Chrome
      - Others
  validations:
    required: true
- type: input
  id: browser-version
  attributes:
    label:
      CN: 浏览器版本
      TW: 瀏覽器版本
    description:
      CN: |
        请填入运行本插件的浏览器的版本。

        [Microsoft Edge](https://support.microsoft.com/zh-cn/microsoft-edge/c726bee8-c42e-e472-e954-4cf5123497eb) ·
        [Google Chrome](chrome://settings/help)
      TW: |
        請填入運行本插件的瀏覽器的版本。

        [Microsoft Edge](https://support.microsoft.com/zh-cn/microsoft-edge/c726bee8-c42e-e472-e954-4cf5123497eb) ·
        [Google Chrome](chrome://settings/help)
    placeholder:
      CN: 版本 146.0.3856.62 (正式版本) (arm64)
      TW: 版本 146.0.3856.62 (正式組建) (arm64)
  validations:
    required: true
- type: dropdown
  id: script-manager-name
  attributes:
    label:
      CN: 脚本管理器名称
      TW: 腳本管理器名稱
    description:
      CN: 请选择管理本插件的脚本管理器的名称。
      TW: 請選擇管理本插件的腳本管理器的名稱。
    options:
      - 篡改猴（Tampermonkey）
      - Others
  validations:
    required: true
- type: input
  id: script-manager-version
  attributes:
    label:
      CN: 脚本管理器版本
      TW: 腳本管理器版本
    description:
      CN: |
        请填入管理本插件的脚本管理器的版本。

        [Microsoft Edge 扩展](https://support.microsoft.com/zh-cn/topic/a3ae1ebb-8e7f-49df-a5f8-8c3f56c8078b)
      TW: |
        請填入管理本插件的腳本管理器的版本。

        [Microsoft Edge 擴展](https://support.microsoft.com/zh-cn/topic/a3ae1ebb-8e7f-49df-a5f8-8c3f56c8078b)
    placeholder: "5.4.1"
  validations:
    required: true
- type: input
  id: plugin-version
  attributes:
    label:
      CN: 插件版本
      TW: 外掛版本
    description:
      CN: |
        请填入 GitHub 中文化插件的版本。

        见本插件源码中 `@version` 的值（不再接受 1.9.2 版本反馈）。

        [Microsoft Edge](extension://iikmkjmpaadaobahmlepeloendndfphd/options.html)
      TW: |
        請填入 GitHub 中文化外掛的版本。

        見本外掛原始碼中 `@version` 的值（不再接受 1.9.2 版本回饋）。

        [Microsoft Edge](extension://iikmkjmpaadaobahmlepeloendndfphd/options.html)
    placeholder: "1.9.3"
  validations:
    required: true
