    required: true
- type: input
  id: plugin-version
  attributes:
    label: 外掛版本
    description: |
      請填入 GitHub 中文化外掛的版本。

      見本外掛原始碼中 `@version` 的值（不再接受 1.9.2 版本回饋）。

      [Microsoft Edge](extension://iikmkjmpaadaobahmlepeloendndfphd/options.html)
    placeholder: 1.9.3
  validations:
    required: true
