name: main.user.js version update & sync main(nju.edu).user.js, zh-TW
on:
  schedule:
    # 每周日的UTC时间16点（北京时间周一凌晨0点）
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_main:
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      locals_js_date: ${{ steps.main_version.outputs.locals_js_date }}
      commit-sha: ${{ steps.api_commit.outputs.commit-sha }}
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test if locals.js has changed since the last release
        id: detect_locals_js_changes
        run: |
          # 最近提交是否存在tag
          if [ ! "$(git tag --contains ${{ github.sha }})" ]; then
            # 获得最近以`main.user.js Update to`开头的提交的sha和时间戳
            release_commit_sha=$(git log --grep="^main.user.js Update to" -n 1 --pretty=format:"%H")
            release_commit_timestamp=$(git show -s --format=%ct $release_commit_sha)

            # 最近的tag对应提交的sha和时间戳
            latest_tag_commit_sha=$(git rev-list --tags --max-count=1)
            latest_tag_commit_timestamp=$(git show -s --format=%ct $latest_tag_commit_sha)

            if [ $release_commit_timestamp -gt $latest_tag_commit_timestamp ]; then
              ref=$release_commit_sha
            else
              ref=$latest_tag_commit_sha
            fi

            # 如果 locals.js 变化，设置环境变量
            git diff --quiet --exit-code $ref locals.js || \
            echo "LOCALS_JS_CHANGED=true" >> $GITHUB_ENV
          fi

      # 如果 locals.js 没有变化，直接跳过后续步骤
      - name: Exit if no changes in locals.js
        if: env.LOCALS_JS_CHANGED != 'true'
        run: echo "No changes in locals.js, exiting..."

      - name: Update version in main.user.js
        id: main_version
        if: env.LOCALS_JS_CHANGED == 'true'
        run: |
          # 获取最后一次提交中`locals.js`的文件时间
          locals_js_time=$(git log -1 --format=%at -- locals.js)

          # 使用`locals.js`的文件日期为词库版本号
          locals_js_date=$(TZ='Asia/Shanghai' date -d "@$locals_js_time" +'%Y-%m-%d')
          echo "locals_js_date=$locals_js_date" >> $GITHUB_OUTPUT

          # 更新 main.user.js
          sed -i -E "
            s/(@version\s*([0-9]+\.){2,3}[0-9]+)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?/\1-$locals_js_date/
            s/(@require.+locals\.js\?v([0-9]+\.){2,3}[0-9]+)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?/\1-$locals_js_date/
          " main.user.js

          # 同步 main(nju.edu).user.js 镜像
          cp main.user.js "main(nju.edu).user.js"
          # 将 @require 中的 URL 替换为 nju.edu 镜像地址（请根据实际情况修改 URL）
          sed -i -E "
            s|(@require\s+)https?://[^/]+/.*/locals\.js\?v[^ ]*|\1https://mirror.nju.edu.cn/github-chinese/locals.js?v=$locals_js_date|
          " "main(nju.edu).user.js"

          # 如果 main.user.js 变化，设置环境变量、并获取 version
          git diff --quiet --exit-code main.user.js || \
          echo "MAIN_USER_JS_CHANGED=true" >> $GITHUB_ENV
          echo "version=$(sed -n -E 's/^\/\/ @version\s+(.+)/\1/p' main.user.js)" >> $GITHUB_OUTPUT

      - name: Commit and push
        id: api_commit
        if: env.LOCALS_JS_CHANGED == 'true' && env.MAIN_USER_JS_CHANGED == 'true'
        uses: maboloshi/dco-commit-action@v1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          app-slug: ${{ steps.generate_token.outputs.app-slug }}
          files: "main.user.js, main(nju.edu).user.js"
          headline: "main.user.js, main(nju.edu).user.js Update to ${{ steps.main_version.outputs.version }}"

  sync_zh_tw:
    runs-on: ubuntu-latest
    if: success() && needs.update_main.outputs.commit-sha != ''
    needs: update_main
    environment: github-pages
    steps:
      - name: Checkout files
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update_main.outputs.commit-sha }}

      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives/*.deb
            !/var/cache/apt/archives/partial
            !/var/cache/apt/archives/lock
          key: apt-${{ runner.os }}-${{ hashFiles('**/apt-packages.txt') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install OpenCC
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc

      - name: Sync locals.js -> locals_zh-TW.js
        run: |
          opencc -i locals.js -o locals_zh-TW.js -c s2tw.json
          perl ./script/t2s-convert.pl -v locals_zh-TW.js

      - name: Update version in main_zh-TW.user.js
        id: TW_version
        run: |
          # 同步版本号
          locals_js_date="${{ needs.update_main.outputs.locals_js_date }}"
          sed -i -E "
            s/(@version\s*([0-9]+\.){2,3}[0-9]+)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?/\1-$locals_js_date/
            s/(@require.+locals_zh-TW.js\?v([0-9]+\.){2,3}[0-9]+)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?/\1-$locals_js_date/
          " main_zh-TW.user.js
          echo "version=$(sed -n -E 's/^\/\/ @version\s+(.+)/\1/p' main_zh-TW.user.js)" >> $GITHUB_OUTPUT

      - name: Commit and push
        uses: maboloshi/dco-commit-action@v1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          app-slug: ${{ steps.generate_token.outputs.app-slug }}
          parent-sha: ${{ needs.update_main.outputs.commit-sha }}
          files: "main_zh-TW.user.js, locals_zh-TW.js"
          headline: "main_zh-TW.user.js Sync Thesaurus to ${{ steps.TW_version.outputs.version }}"
