name: 多语言文件一致性
on:
  pull_request:
    paths:
      - 'script/multilingual-issue-templates/**'
      - 'script/manage_templates.py'
      - 'pyproject.toml'
  push:
    paths:
      - 'script/multilingual-issue-templates/**'
      - 'script/manage_templates.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python script/manage_templates.py --requirements
          pip install -r script/requirements.txt

      # ── PR：验证 + 试生成（不提交） ──
      - name: Validate & dry-run
        if: github.event_name == 'pull_request'
        run: |
          python script/manage_templates.py --check
          python script/manage_templates.py

      # ── 默认分支：验证 + 生成 + 自动提交（分支名语义化，随默认分支自适应） ──
      - name: Generate & commit
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          python script/manage_templates.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/ISSUE_TEMPLATE/ CONTRIBUTING.md CONTRIBUTING_zh-TW.md
          if git diff --cached --exit-code; then
            echo "No changes."
          else
            git commit -m "chore: auto-generate multilingual files"
            git push
          fi
