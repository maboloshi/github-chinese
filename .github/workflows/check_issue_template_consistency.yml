name: Issue 模板一致性
on:
  pull_request:
    paths:
      - 'script/multilingual-issue-templates/**'
      - 'script/manage_templates.py'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'script/multilingual-issue-templates/**'
      - 'script/manage_templates.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml opencc-python-reimplemented

      # ── PR：验证 + 试生成（不检查 diff，不提交） ──
      - name: Validate multilingual sources
        if: github.event_name == 'pull_request'
        run: python script/manage_templates.py --check

      - name: Dry-run generate
        if: github.event_name == 'pull_request'
        run: python script/manage_templates.py

      # ── push to main：验证 + 生成 + 自动提交 ──
      - name: Generate & commit
        if: github.event_name != 'pull_request'
        run: |
          python script/manage_templates.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/ISSUE_TEMPLATE/
          if git diff --cached --exit-code; then
            echo "No changes."
          else
            git commit -m "chore: auto-generate issue templates"
            git push
          fi
