name: Update contributors images in README.md
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Contributors Images
        uses: jaywcjlove/github-action-contributors@v2.1.0
        id: contributors
        with:
          filter-author: (action-assistant\[bot\]|renovate\[bot\]|renovate-bot|@github-actions-bot|dependabot\[bot\]|ImgBotApp|imgbot\[bot\])
          avatarSize: 42

      - name: Setup Python and install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r script/requirements.txt

      - name: Update README.yml contributors and regenerate docs
        env:
          HTML_LIST: ${{ steps.contributors.outputs.htmlList }}
        run: |
          printf '%s' "$HTML_LIST" | python script/update_contributors.py
          python script/manage_templates.py
          # 检测源文件 README.yml 是否被更新（生成文件已 gitignore，git diff 检测不到未跟踪文件）
          git diff --quiet --exit-code script/multilingual-docs/README.yml || echo "CHANGES_DETECTED=true" >> $GITHUB_ENV

      - name: Commit and push docs
        if: ${{ env.CHANGES_DETECTED == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
        run: |
          bash script/ci_commit_with_signature.sh \
          -R "${{ github.repository }}" \
          -B "${{ github.ref_name }}" \
          -P "${{ github.sha }}" \
          -F "README.md README_zh-TW.md script/multilingual-docs/README.yml" \
          -h "修改文档: 更新\`贡献者列表\`"
