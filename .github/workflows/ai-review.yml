name: AI 代码审查（DeepSeek）

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 目标仓库 owner/repo（默认本仓库）
        required: false
        default: ''
      pr:
        description: PR 编号
        required: true
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review'))
    steps:
      - uses: actions/checkout@v4

      - name: 解析目标仓库、PR 与 head SHA
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            repo="${{ inputs.repo || github.repository }}"
            pr="${{ inputs.pr }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            repo="${{ github.repository }}"
            pr="${{ github.event.issue.number }}"
          else
            repo="${{ github.repository }}"
            pr="${{ github.event.pull_request.number }}"
          fi
          case "$repo" in
            */*) ;;
            *) echo "❌ repo 参数格式应为 owner/repo（当前：$repo）"; exit 1 ;;
          esac
          sha=$(gh api "repos/$repo/pulls/$pr" --jq '.head.sha' 2>/dev/null || echo "")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 去重（同一 head SHA 已审过则跳过）
        id: dedup
        run: |
          sha="${{ steps.ctx.outputs.sha }}"
          if [ -z "$sha" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments=$(gh api "repos/${{ steps.ctx.outputs.repo }}/issues/${{ steps.ctx.outputs.pr }}/comments" --jq '.[].body' 2>/dev/null || true)
          if printf '%s' "$comments" | grep -q "ai-review:$sha"; then
            echo "该 head（$sha）已审查过，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成 AI 审查
        if: steps.dedup.outputs.skip != 'true' && env.LLM_API_KEY != ''
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
        run: |
          python script/ai_review.py \
            --repo "${{ steps.ctx.outputs.repo }}" \
            --pr "${{ steps.ctx.outputs.pr }}" \
            --out review.md

      - name: 发布审查评论
        if: steps.dedup.outputs.skip != 'true' && env.LLM_API_KEY != '' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const sha = "${{ steps.ctx.outputs.sha }}";
            const repo = '${{ steps.ctx.outputs.repo }}';
            const pr = Number('${{ steps.ctx.outputs.pr }}');
            await github.rest.issues.createComment({
              owner: repo.split('/')[0],
              repo: repo.split('/')[1],
              issue_number: pr,
              body: body + `\n\n<!--ai-review:${sha}-->`
            });
