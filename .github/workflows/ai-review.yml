name: AI 代码审查（DeepSeek）

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 目标仓库 owner/repo（默认本仓库）
        required: false
        default: ''
      pr:
        description: PR 编号
        required: true
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'manual' }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      APP_ID: ${{ secrets.APP_ID }}
      TARGET_REPO: ${{ vars.REVIEW_TARGET || 'maboloshi/github-chinese' }}
      WATCHLIST: ${{ vars.REVIEW_WATCHLIST || '' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && vars.REVIEW_WATCHLIST != '') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review') &&
       (github.event.comment.user.login == github.event.issue.user.login ||
        github.event.comment.user.login == github.repository_owner))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验 workflow_dispatch 输入
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_PR: ${{ inputs.pr }}
        run: |
          case "$IN_REPO" in
            */*) ;;
            *) echo "::error::repo 参数格式应为 owner/repo（当前：$IN_REPO）"; exit 1 ;;
          esac
          case "$IN_PR" in
            ''|*[!0-9]*) echo "::error::pr 参数必须为数字（当前：$IN_PR）"; exit 1 ;;
          esac

      - name: 解析目标仓库、PR 与 head SHA
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            repo="${{ inputs.repo || github.repository }}"
            pr="${{ inputs.pr }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            repo="${{ github.repository }}"
            pr="${{ github.event.issue.number }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            repo="${{ github.repository }}"
            pr="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            repo="${TARGET_REPO:-maboloshi/github-chinese}"
            owner="${{ github.repository_owner }}"
            IFS=',' read -ra WATCH <<< "$WATCHLIST"
            for p in "${WATCH[@]}"; do
              [ -z "$p" ] && continue
              hit=$(gh api "repos/$repo/issues/$p/comments" \
                --jq "[.[] | select(.user.login == \"$owner\") | select(.body | contains(\"/review\"))] | length" 2>/dev/null || echo 0)
              if [ "$hit" != "0" ]; then
                pr="$p"
                break
              fi
            done
          fi
          if [ -z "$repo" ] || [ -z "$pr" ]; then
            echo "本次无目标 PR（schedule 看护清单中无待审 /review），跳过。"
            exit 0
          fi
          case "$repo" in
            */*) ;;
            *) echo "❌ repo 参数格式应为 owner/repo（当前：$repo）"; exit 1 ;;
          esac
          sha=$(gh api "repos/$repo/pulls/$pr" --jq '.head.sha' 2>/dev/null || echo "")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "owner=${repo%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${repo#*/}" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 去重（同一 head SHA 已审过则跳过）
        id: dedup
        if: steps.ctx.outputs.pr != ''
        run: |
          sha="${{ steps.ctx.outputs.sha }}"
          if [ -z "$sha" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comments=$(gh api "repos/${{ steps.ctx.outputs.repo }}/issues/${{ steps.ctx.outputs.pr }}/comments" --jq '.[].body' 2>/dev/null || true)
          if printf '%s' "$comments" | grep -q "ai-review:$sha"; then
            echo "该 head（$sha）已审查过，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查 LLM_API_KEY
        if: steps.ctx.outputs.pr != '' && env.LLM_API_KEY == ''
        run: echo "⚠️ 未配置 LLM_API_KEY，本次审查已跳过。请在 Settings → Secrets and variables → Actions 中添加。"

      - name: 生成 AI 审查
        if: steps.ctx.outputs.pr != '' && steps.dedup.outputs.skip != 'true' && env.LLM_API_KEY != ''
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
        run: |
          python script/ai_review.py \
            --repo "${{ steps.ctx.outputs.repo }}" \
            --pr "${{ steps.ctx.outputs.pr }}" \
            --out review.md \
            --out-comments review_comments.json

      - name: 生成 GitHub App 安装令牌（bot 身份）
        id: app-token
        if: steps.ctx.outputs.pr != '' && steps.dedup.outputs.skip != 'true' && env.LLM_API_KEY != '' && env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.ctx.outputs.owner }}
          repositories: ${{ steps.ctx.outputs.repo_name }}

      - name: 组装审查评论文件（追加去重标记）
        if: steps.ctx.outputs.pr != '' && steps.dedup.outputs.skip != 'true' && env.LLM_API_KEY != ''
        run: |
          printf '\n\n<!--ai-review:%s-->' "${{ steps.ctx.outputs.sha }}" >> review.md

      - name: 发布审查评论（汇总 + 内联建议）
        if: steps.ctx.outputs.pr != '' && steps.dedup.outputs.skip != 'true' && env.LLM_API_KEY != ''
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          C_REPO: ${{ steps.ctx.outputs.repo }}
          C_PR: ${{ steps.ctx.outputs.pr }}
          C_SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          export GH_TOKEN="${APP_TOKEN:-${{ github.token }}}"
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["C_REPO"]
          pr = os.environ["C_PR"]
          sha = os.environ["C_SHA"]

          # 1) 汇总评论（含去重标记）
          summary = open('review.md', encoding='utf-8').read()
          open('.comment.json', 'w', encoding='utf-8').write(json.dumps({'body': summary}))
          r = subprocess.run(['gh', 'api', f'repos/{repo}/issues/{pr}/comments', '--input', '.comment.json', '--jq', '.html_url'], capture_output=True, text=True)
          print('汇总评论:', r.stdout.strip() or r.stderr.strip())

          # 2) 内联建议评论（带 Apply suggestion 按钮）
          try:
              comments = json.load(open('review_comments.json', encoding='utf-8'))
          except Exception:
              comments = []
          ok = 0
          for c in comments:
              payload = {'body': c['body'], 'commit_id': sha, 'path': c['path'], 'line': c['line'], 'side': 'RIGHT'}
              open('.inline.json', 'w', encoding='utf-8').write(json.dumps(payload))
              r = subprocess.run(['gh', 'api', f'repos/{repo}/pulls/{pr}/comments', '--input', '.inline.json', '--jq', '.html_url'], capture_output=True, text=True)
              if r.returncode == 0:
                  ok += 1
              else:
                  print(f"⚠️ 内联建议失败 {c.get('path')}:{c.get('line')} {r.stderr.strip()[:200]}")
          print(f'内联建议：共 {len(comments)} 条，成功 {ok} 条')
          PY
